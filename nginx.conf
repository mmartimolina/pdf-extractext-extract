events {}

http {
    # Docker Engine DNS: permite actualizar las IP de las réplicas escaladas.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream extract_backend {
        zone extract_backend 64k;
        least_conn;
        server extract:8000 resolve;
    }

    server {
        listen 8000;
        client_max_body_size 20m;

        location / {
            proxy_pass http://extract_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
