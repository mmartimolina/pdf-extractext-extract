services:
  extract:
    build: .
    expose:
      - "8000"

    environment:
      MAX_PDF_SIZE_BYTES: 20971520
      CONSUL_HTTP_ADDR: "${CONSUL_HTTP_ADDR:-}"
      SERVICE_ADDRESS: "extract"

    cpus: "1.0"
    mem_limit: 1G

    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pdf-ecosystem

  nginx:
    image: nginx:1.27.3-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - extract
    networks:
      - pdf-ecosystem

networks:
  pdf-ecosystem:
    external: true
    name: ${PDF_ECOSYSTEM_NETWORK:-pdf-ecosystem-net}