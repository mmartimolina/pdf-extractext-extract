services:
  extract:
    build: .
    container_name: pdf-extractext-extract
    ports:
      - "8000:8000"
    environment:
      MAX_PDF_SIZE_BYTES: 20971520
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
